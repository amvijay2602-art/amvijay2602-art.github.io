<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#17643F">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Deliveries">
  <title>Birkhill Deliveries and Suppliers</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="stylesheet" href="../scanned-list.css">
  <style id="birkhill-theme">
    :root { --bk-g:#17643F; --bk-gd:#0f4a2e; --bk-o:#E86B2A; --bk-bg:#F4F7F4; --bk-ink:#18342A; --bk-line:#d5e3da; }
    html, body { background: var(--bk-bg); color: var(--bk-ink); }
    body { font-family: "Nunito Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 16px; }
    input, select, textarea { font-size: 16px !important; }
    button, .btn, input[type="text"], input[type="number"], input[type="date"], input[type="search"], input[type="password"], select { min-height: 48px; }
    .card { border-radius: 18px !important; box-shadow: 0 1px 4px rgba(24,52,42,.10) !important; }
    .bk-logo { display:block; margin: 0 auto 6px; height: 44px; width: auto; }
    body.bk-has-nav { padding-bottom: calc(88px + env(safe-area-inset-bottom)) !important; }
    .bk-nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 9990; display: grid; background: #fff; border-top: 1px solid var(--bk-line); box-shadow: 0 -2px 8px rgba(24,52,42,.08); padding-bottom: env(safe-area-inset-bottom); }
    .bk-nav a { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:58px; color: var(--bk-ink); text-decoration:none; font: 700 12px/1.1 system-ui, sans-serif; gap: 3px; }
    .bk-nav a .i { font-size: 20px; line-height: 1; }
    .bk-nav a.on { color: var(--bk-g); box-shadow: inset 0 3px 0 var(--bk-g); }
  </style>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 12px 12px 24px; }
    main { max-width: 640px; margin: 0 auto; }
    h1 { text-align: center; margin: 0 0 2px; font-size: 1.5rem; color: var(--bk-g); }
    .sub { text-align: center; color: #5b6573; font-size: .9rem; margin-bottom: 10px; }
    .card { background: #fff; padding: 14px; margin: 0 0 12px; }
    .card h2 { margin: 0 0 10px; font-size: 1.1rem; }
    .btn { display: block; width: 100%; border: 0; border-radius: 14px; padding: 12px; font-size: 1.05rem; font-weight: 800; color: #fff; background: var(--bk-g); cursor: pointer; }
    .btn.o { background: var(--bk-o); } .btn.red { background: #c62828; }
    .btn.sec { background: #eef5f0; color: var(--bk-g); border: 1px solid var(--bk-line); }
    .btn.small { display: inline-block; width: auto; padding: 8px 14px; min-height: 40px; font-size: .95rem; }
    .btn:disabled { opacity: .5; }
    .row { display: flex; gap: 8px; align-items: flex-end; flex-wrap: wrap; }
    .row > * { flex: 1 1 120px; }
    input[type=text], input[type=number], input[type=date], input[type=password], input[type=search], select, textarea { width: 100%; border: 1px solid #c9d6ce; border-radius: 12px; padding: 10px; background: #fff; color: var(--bk-ink); }
    label.f { display: block; font-weight: 700; font-size: .88rem; margin: 8px 0 4px; }
    .hidden { display: none !important; }
    .msg { border-radius: 12px; padding: 10px 12px; margin-top: 10px; font-weight: 600; font-size: .95rem; }
    .msg.ok { background: #e8f6ec; color: #1b7a3d; } .msg.err { background: #fdecec; color: #c62828; } .msg.warn { background: #fef3c7; color: #8a4b08; }
    .tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 8px; }
    .tabs button { flex: 0 0 auto; border: 1px solid var(--bk-line); background: #fff; color: var(--bk-ink); border-radius: 999px; padding: 8px 14px; font-weight: 800; font-size: .92rem; min-height: 42px; }
    .tabs button.on { background: var(--bk-g); color: #fff; border-color: var(--bk-g); }
    .tabs .n { display: inline-block; min-width: 20px; border-radius: 999px; background: var(--bk-o); color: #fff; font-size: .75rem; padding: 1px 6px; margin-left: 4px; }
    .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .tile { background: #fff; border: 1px solid var(--bk-line); border-radius: 16px; padding: 14px; text-align: left; font-weight: 800; font-size: 1rem; color: var(--bk-ink); min-height: 84px; }
    .tile small { display: block; font-weight: 600; color: #5b6573; font-size: .8rem; margin-top: 4px; }
    .tile .big { font-size: 1.6rem; display: block; }
    .list .item { border: 1px solid #e3ebe6; border-radius: 14px; padding: 10px; margin-bottom: 8px; background: #fff; }
    .item .t { font-weight: 800; } .m { color: #5b6573; font-size: .85rem; margin-top: 2px; }
    .st { display: inline-block; font-size: .75rem; font-weight: 800; border-radius: 999px; padding: 2px 9px; background: #eef5f0; color: var(--bk-g); }
    .st.draft { background: #eef2ff; color: #3730a3; } .st.needs_fix, .st.error { background: #fdecec; color: #c62828; }
    .st.pending_approval { background: #fef3c7; color: #8a4b08; } .st.approved, .st.sending { background: #e0f2fe; color: #075985; }
    .st.posted { background: #e8f6ec; color: #1b7a3d; } .st.recorded { background: #f3e8ff; color: #6b21a8; } .st.local { background: #fff7ed; color: #9a3412; }
    .line { border: 1px solid #e3ebe6; border-radius: 14px; padding: 10px; margin-bottom: 10px; background: #fff; }
    .line.bad { border-color: #f1a5a5; background: #fffafa; } .line.out { opacity: .55; }
    .lh { display: flex; gap: 10px; }
    .pic { width: 64px; height: 64px; flex: 0 0 64px; border-radius: 12px; background: #eef5f0; display: flex; align-items: center; justify-content: center; overflow: hidden; font-size: 1.6rem; }
    .pic img { width: 100%; height: 100%; object-fit: contain; background: #fff; }
    .ln { font-weight: 800; line-height: 1.2; } .lm { color: #5b6573; font-size: .82rem; margin-top: 2px; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 8px; }
    .grid label { font-size: .75rem; font-weight: 800; color: #5b6573; display: block; }
    .grid input, .grid select { min-height: 42px; padding: 6px 8px; }
    .flag { font-size: .82rem; font-weight: 700; color: #c62828; margin-top: 6px; } .note { font-size: .82rem; font-weight: 700; color: #8a4b08; margin-top: 6px; }
    .pill { position: fixed; top: 8px; right: 8px; z-index: 9999; background: #fef3c7; color: #8a4b08; border-radius: 999px; padding: 4px 10px; font-size: .8rem; font-weight: 800; }
    .mgrbar { position: fixed; top: 8px; left: 8px; z-index: 9999; background: var(--bk-g); color: #fff; border-radius: 999px; padding: 4px 10px; font-size: .8rem; font-weight: 800; }
    table.t { width: 100%; border-collapse: collapse; font-size: 14px; }
    table.t th, table.t td { border-bottom: 1px solid #e3ebe6; padding: 6px 4px; text-align: left; vertical-align: top; }
    table.t td.n, table.t th.n { text-align: right; }
    .ud { display: flex; gap: 10px; align-items: center; border-bottom: 1px solid #eef2ef; padding: 8px 0; }
    .ud .q { display: flex; align-items: center; gap: 4px; }
    .ud .q button { width: 42px; min-height: 42px; border-radius: 10px; border: 1px solid var(--bk-line); background: #eef5f0; font-weight: 900; font-size: 1.2rem; }
    .ud .q input { width: 58px; text-align: center; min-height: 42px; padding: 4px; }
    .ud .ret input { width: 58px; text-align: center; min-height: 42px; padding: 4px; border-color: #c4b5fd; }
    .ud .exp { font-size: .78rem; color: #5b6573; }
    .empty { color: #5b6573; font-size: .92rem; }
    video { width: 100%; border-radius: 14px; margin-top: 10px; background: #000; max-height: 240px; object-fit: cover; }
    .search-res .item { cursor: pointer; display: flex; gap: 8px; align-items: center; border: 1px solid #e3ebe6; border-radius: 12px; padding: 6px; margin-top: 6px; }
    @media print { body { font-size: 14pt; } .tabs, .bk-nav, .btn, .pill, .mgrbar { display: none !important; } table.t { font-size: 14pt; } }
  </style>
</head>
<body>
<main>
  <h1>Deliveries and Suppliers</h1>
  <div class="sub" id="sub">Stock In drafts, approval and posting to the till</div>
  <div id="pill" class="pill hidden"></div>
  <div id="mgrbar" class="mgrbar hidden"></div>
  <div class="tabs" id="tabs"></div>
  <div id="view"></div>
  <div class="empty" id="dataNote" style="text-align:center;margin-top:10px"></div>
</main>
<script src="../secure-data.js"></script>
  <script src="../scanned-list.js"></script>
  <script src="invoice.js"></script>
<script>
(function () {
  "use strict";
  var ENDPOINT = "https://script.google.com/macros/s/AKfycbz7eKFQN2UbbSA8-4nLzB9crDkQUE5b7_CJ3wnVfqmxODFIfz8G3XNpQ1_igg9SCNJbKg/exec";
  var K = { queue: "birkhill-si-queue-v1", docs: "birkhill-si-local-docs-v1", mgr: "birkhill-si-manager-v1" };
  var STATUS = { draft: "Draft", needs_fix: "Needs fixing", pending_approval: "Waiting for manager", approved: "Approved, sending to till", sending: "Sending to till", posted: "Posted", error: "Posting error", recorded: "Return recorded", discarded: "Discarded", local: "Not sent yet" };
  var VATS = [["", "VAT?"], ["20", "20%"], ["5", "5%"], ["0", "0%"], ["NA", "N/A"]];
  var SI = null, PR = null, BYID = {}, BYBC = {}, cur = { tab: "home", doc: null };
  function $(id) { return document.getElementById(id); }
  function jget(k, d) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
  function jset(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function digits(s) { return String(s || "").replace(/\D/g, ""); }
  function bkey(b) { return digits(b).replace(/^0+/, ""); }
  function staff() { try { return localStorage.getItem("birkhill-staff-name") || ""; } catch (e) { return ""; } }
  function money(n) { return n == null || n === "" || isNaN(Number(n)) ? "-" : "\u00a3" + Number(n).toFixed(2); }
  function num(v) { var n = parseFloat(v); return isNaN(n) ? 0 : n; }
  function londonParts() { var f = new Intl.DateTimeFormat("en-GB", { timeZone: "Europe/London", year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false }).formatToParts(new Date()); var o = {}; f.forEach(function (p) { o[p.type] = p.value; }); return o; }
  function londonISO() { var o = londonParts(); return o.year + "-" + o.month + "-" + o.day; }
  function londonAt() { var o = londonParts(); return o.year + "-" + o.month + "-" + o.day + "T" + (o.hour === "24" ? "00" : o.hour) + ":" + o.minute + ":" + o.second; }
  function ukDate(iso) { return iso ? iso.slice(8, 10) + "/" + iso.slice(5, 7) + "/" + iso.slice(2, 4) : ""; }
  function newId(p) { var o = londonParts(), a = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789", s = ""; for (var i = 0; i < 4; i++) s += a[Math.floor(Math.random() * a.length)]; return p + o.year.slice(2) + o.month + o.day + "-" + s; }
  function each(sel, fn) { Array.prototype.forEach.call($("view").querySelectorAll(sel), fn); }
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function () {});

  // offline-safe send queue (same Apps Script and Camera Entries tab as the other Birkhill apps)
  var sending = false;
  function pill() { var q = jget(K.queue, []); $("pill").textContent = q.length + " waiting to send"; $("pill").classList.toggle("hidden", q.length === 0); }
  function queueEv(ev) { var q = jget(K.queue, []); q.push({ name: "SI1: " + JSON.stringify(ev), photo: "", lines: [{ date: londonISO(), qty: "0" }] }); jset(K.queue, q); pill(); flush(); }
  function flush() {
    if (sending) return; var q = jget(K.queue, []); pill(); if (!q.length) return; sending = true;
    fetch(ENDPOINT, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain" }, body: JSON.stringify(q[0]) })
      .then(function () { var q2 = jget(K.queue, []); q2.shift(); jset(K.queue, q2); sending = false; flush(); })
      .catch(function () { sending = false; pill(); setTimeout(flush, 15000); });
  }
  window.addEventListener("online", flush); setInterval(flush, 30000);
  function sendDraft(doc) {
    var s = JSON.stringify({ kind: doc.kind, sid: doc.sid, ref: doc.ref, date: doc.date, staff: doc.staff, notes: doc.notes || "", lines: doc.lines, returns: doc.returns || [], source: doc.source || "app", scan: doc.scan || undefined, delivered_checked: doc.delivered_checked || undefined });
    var size = 30000, parts = Math.max(1, Math.ceil(s.length / size));
    for (var i = 0; i < parts; i++) queueEv({ t: "draft", id: doc.id, rev: doc.rev, part: i, parts: parts, by: staff() || doc.staff, d: s.slice(i * size, (i + 1) * size) });
  }

  // manager crypto: the code never leaves the phone; the box checks an HMAC signature
  function hex(buf) { return Array.prototype.map.call(new Uint8Array(buf), function (b) { return ("0" + b.toString(16)).slice(-2); }).join(""); }
  function unhex(h) { var a = new Uint8Array(h.length / 2); for (var i = 0; i < a.length; i++) a[i] = parseInt(h.substr(i * 2, 2), 16); return a; }
  function deriveKey(name, code) {
    var enc = new TextEncoder();
    return crypto.subtle.importKey("raw", enc.encode(code), "PBKDF2", false, ["deriveBits"]).then(function (k) {
      return crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt: enc.encode("BH-MGR-" + name.trim().toUpperCase()), iterations: 100000 }, k, 256);
    }).then(hex);
  }
  function hmacHex(keyHex, msg) {
    return crypto.subtle.importKey("raw", unhex(keyHex), { name: "HMAC", hash: "SHA-256" }, false, ["sign"]).then(function (k) { return crypto.subtle.sign("HMAC", k, new TextEncoder().encode(msg)); }).then(hex);
  }
  function sha256(s) { return crypto.subtle.digest("SHA-256", new TextEncoder().encode(s)).then(hex); }
  function rsaEnc(obj) {
    var der = Uint8Array.from(atob(SI.rsa_public), function (c) { return c.charCodeAt(0); });
    return crypto.subtle.importKey("spki", der, { name: "RSA-OAEP", hash: "SHA-256" }, false, ["encrypt"]).then(function (k) {
      return crypto.subtle.encrypt({ name: "RSA-OAEP" }, k, new TextEncoder().encode(JSON.stringify(obj)));
    }).then(function (b) { return btoa(String.fromCharCode.apply(null, new Uint8Array(b))); });
  }
  function mgr() { try { return JSON.parse(sessionStorage.getItem(K.mgr) || "null"); } catch (e) { return null; } }
  function mgrBar() { var m = mgr(); $("mgrbar").textContent = m ? "Manager: " + m.name : ""; $("mgrbar").classList.toggle("hidden", !m); }
  function signRaw(msgFn) { var m = mgr(); if (!m) { alert("Manager login needed. Open the Manager tab."); return Promise.reject(new Error("no manager")); } var at = londonAt(); return Promise.resolve(msgFn(at, m.name)).then(function (msg) { return hmacHex(m.key, msg); }).then(function (sig) { return { at: at, by: m.name, sig: sig }; }); }
  function signed(t, id, rev, extra) {
    return signRaw(function (at, by) { return t + "|" + id + "|" + rev + "|" + at + "|" + by; }).then(function (s) {
      var ev = { t: t, id: id, rev: rev, at: s.at, by: s.by, sig: s.sig }; for (var k in (extra || {})) ev[k] = extra[k]; queueEv(ev); return ev;
    });
  }

  // data
  function load() {
    return Promise.all([
      fetch("stockin.json").then(function (r) { if (!r.ok) throw new Error("locked"); return r.json(); }),
      fetch("stockin_products.json").then(function (r) { if (!r.ok) throw new Error("locked"); return r.json(); })
    ]).then(function (res) {
      SI = res[0]; PR = res[1]; BYID = {}; BYBC = {};
      PR.p.forEach(function (a) {
        var p = { id: a[0], n: a[1], s: a[2], b: a[3], q: a[4], c: a[5], p: a[6], vat: a[7], upc: a[8], cc: a[9], i: a[10], ld: a[11], ls: a[12], lcc: a[13], lupc: a[14], sup: a[15] };
        BYID[p.id] = p; p.b.forEach(function (b) { var k = bkey(b); if (k && (!BYBC[k] || BYBC[k].q === 0)) BYBC[k] = p; });
      });
      $("dataNote").textContent = "Updated " + SI.generated_display + ". Till posting is " + (SI.writes_enabled ? "on" : "switched off on the box") + ".";
      var loc = jget(K.docs, {}), sd = docsById();
      Object.keys(loc).forEach(function (id) { if (sd[id] && (sd[id].rev || 0) >= (loc[id].rev || 0) && !loc[id].unsent) delete loc[id]; });
      jset(K.docs, loc);
    });
  }
  function docsById() { var o = {}; (SI ? SI.docs : []).forEach(function (d) { o[d.id] = d; }); return o; }
  function allDocs() {
    var o = docsById(), loc = jget(K.docs, {});
    Object.keys(loc).forEach(function (id) { if (!o[id] || (loc[id].rev || 0) >= (o[id].rev || 0)) o[id] = Object.assign({}, o[id] || {}, loc[id]); });
    return Object.keys(o).map(function (k) { return o[k]; }).filter(function (d) { return status(d) !== "discarded"; }).sort(function (a, b) { return String(b.updated || b.created || "").localeCompare(String(a.updated || a.created || "")); });
  }
  function status(d) { return d.localStatus || d.status || "draft"; }
  function supName(sid) { var s = (SI.suppliers || []).filter(function (x) { return x.id === sid; })[0]; return s ? s.name : (sid || "No supplier"); }
  function lookup(code) { var d = digits(code); if (!d) return null; var k = bkey(d); return BYBC[k] || (d.length === 12 ? BYBC[bkey("0" + d)] : null) || (d.length <= 7 ? BYID[parseInt(d, 10)] : null) || null; }
  function picHtml(pid) { var p = BYID[pid]; return p && p.i ? "<img alt='' src='../count/img/" + esc(p.i) + "' onerror=\"this.parentNode.innerHTML='&#128230;'\">" : "&#128230;"; }
  function saveLocal(doc, st_) { var loc = jget(K.docs, {}); doc.updated = londonAt(); if (st_) doc.localStatus = st_; loc[doc.id] = doc; jset(K.docs, loc); }
  function say(id, t, k) { $(id).innerHTML = "<div class='msg " + (k || "ok") + "'>" + esc(t) + "</div>"; }
  // tabs
  var TABS = [["home", "Home"], ["scan", "Invoice Scanner"], ["new", "New delivery"], ["ud", "Milk and bread"], ["drafts", "Drafts"], ["approval", "Pending Approval"], ["errors", "Posting Errors"], ["posted", "Posted Deliveries"], ["suppliers", "Suppliers"], ["reports", "Supplier Reports"], ["manager", "Manager"]];
  function counts() {
    var c = { drafts: 0, approval: 0, errors: 0 };
    allDocs().forEach(function (d) { var s = status(d); if (s === "draft" || s === "local" || s === "recorded") c.drafts++; if (s === "pending_approval") c.approval++; if (s === "error" || s === "needs_fix") c.errors++; });
    return c;
  }
  function renderTabs() {
    var c = counts();
    $("tabs").innerHTML = TABS.map(function (t) { var n = c[t[0]]; return "<button type='button' data-tab='" + t[0] + "' class='" + (cur.tab === t[0] ? "on" : "") + "'>" + t[1] + (n ? "<span class='n'>" + n + "</span>" : "") + "</button>"; }).join("");
    Array.prototype.forEach.call($("tabs").querySelectorAll("button"), function (b) { b.onclick = function () { go(b.getAttribute("data-tab")); }; });
  }
  function go(tab, arg) { cur.tab = tab; renderTabs(); stopCam(); (VIEWS[tab] || VIEWS.home)(arg); window.scrollTo(0, 0); try { history.replaceState(null, "", "?tab=" + tab); } catch (e) {} }

  var VIEWS = {};
  function tile(g, big, t, d) { return "<button type='button' class='tile' data-go='" + g + "'><span class='big'>" + big + "</span>" + t + "<small>" + d + "</small></button>"; }
  VIEWS.home = function () {
    var c = counts(), posted = allDocs().filter(function (d) { return status(d) === "posted"; }).length;
    $("view").innerHTML = "<div class='tiles'>" +
      tile("scan", "&#129534;", "Invoice Scanner", "Photo or PDF of the invoice makes the draft") + tile("new", "&#128666;", "New delivery", "Type, scan or import an EDN") + tile("ud", "&#129371;", "Milk and bread", "Unique Dairies quick check") +
      tile("drafts", c.drafts, "Drafts", "Saved, not sent to the till") + tile("approval", c.approval, "Pending Approval", "Manager checks and approves") +
      tile("errors", c.errors, "Posting Errors", "Fix or send again") + tile("posted", posted, "Posted Deliveries", "In the till, stock before and after") +
      tile("suppliers", (SI.suppliers || []).length, "Suppliers", "Profiles and till link") + tile("reports", "&#128202;", "Supplier Reports", "Spend, deliveries, audit log") + "</div>" +
      "<div class='card' style='margin-top:12px'><h2>How it works</h2><div class='m'>Draft &gt; Check Products &gt; Match Supplier &gt; Manager Approval &gt; Send to Till &gt; Confirm Till Receipt &gt; Posted. Saving a draft never changes the till. Quick item scans still go in the Chiller app Stock In tab; Grok Bot can turn a day's scans into a draft here.</div></div>";
    each(".tile", function (b) { b.onclick = function () { go(b.getAttribute("data-go")); }; });
  };
  function docTotal(d) { var t = 0; (d.lines || []).forEach(function (l) { if (l.leave_out || !l.pid) return; if (d.kind === "return") t += num(l.ret) * num(l.unit_cost); else if (num(l.upc)) t += num(l.case_cost) / num(l.upc) * (num(l.rcv) * num(l.upc) - num(l.damaged)); }); return t; }
  function docList(filter, empty) {
    var ds = allDocs().filter(filter);

    h += "<div class='row'><div><label class='f'>Invoice number</label><input id='scInv' type='text' value='" + esc(r.inv_no) + "'></div><div><label class='f'>Invoice date</label><input id='scDate' type='date' value='" + esc(r.date) + "'></div></div>" +
      "<div class='m' style='margin-top:6px'>" + r.lines.length + " lines &middot; lines add up to " + money(r.sum) + (r.totals.goods != null ? " &middot; invoice goods total " + money(r.totals.goods) + (r.totals_match ? " &#9989; agrees" : " &#9888;&#65039; does not agree") : "") + " &middot; " + matched + " matched to till products &middot; " + flagged + " line(s) to check</div>";
    r.warnings.forEach(function (w) { h += "<div class='note'>" + esc(w) + "</div>"; });
    if (r.dup) h += "<div class='msg err'>" + esc(r.dup) + "</div>";
    if (r.dupWarn) h += "<div class='msg warn'>" + esc(r.dupWarn) + "</div>";
    h += "<table class='t' style='margin-top:8px'><tr><th></th><th>Invoice line</th><th class='n'>Qty</th><th class='n'>Case</th><th class='n'>Cost</th><th>VAT</th></tr>" + r.lines.map(function (l) {
      var p = BYID[l.pid];
      return "<tr><td style='width:44px'><div class='pic' style='width:40px;height:40px;flex-basis:40px'>" + picHtml(l.pid) + "</div></td><td>" + esc(l.desc) + (l.code ? " <span class='lm'>(" + esc(l.code) + ")</span>" : "") +
        "<div class='lm'>" + (p ? (l.match === "suggested" ? "Suggested: " : "Till: ") + esc(p.n) : "Not matched to a till product") + "</div>" + (l.flags.length ? "<div class='lm' style='color:#b45309'>" + esc(l.flags.join("; ")) + "</div>" : "") + "</td>" +
        "<td class='n'>" + (l.qty == null ? "?" : l.qty) + "</td><td class='n'>" + (l.upc == null ? "?" : l.upc) + "</td><td class='n'>" + (l.case_cost == null ? "?" : money(l.case_cost)) + "</td><td>" + (l.vat === "" ? "?" : l.vat + "%") + "</td></tr>";
    }).join("") + "</table>";
    h += "<button class='btn' id='scMake' style='margin-top:12px'" + (r.dup || !r.lines.length ? " disabled" : "") + ">Create Stock In draft</button>" +
      "<div class='m' style='margin-top:6px'>Question marks are left blank on purpose: costs, barcodes and VAT are never guessed. Fill them in from the invoice on the draft.</div></div>";
    return h;
  }
  function makeDraftFromScan() {
    var r = SCAN.parsed, who = staff();
    if (!r.sid) { alert("Pick the supplier first."); return; }
    if (r.dup) return;
    if (!who) { who = (prompt("Your name") || "").trim(); if (!who) return; try { localStorage.setItem("birkhill-staff-name", who); } catch (e) {} }
    var lines = r.lines.map(function (x) {
      var p = BYID[x.pid];
      var l = mkLine(p, { bc: x.bc || "", inv_name: (x.desc + (x.size ? " " + x.size : "")).trim(), inv_code: x.code || "", exp: x.qty == null ? "" : x.qty, rcv: x.qty == null ? 0 : x.qty,
        upc: x.upc == null ? "" : x.upc, case_cost: x.case_cost == null ? "" : x.case_cost, vat: x.vat || "", match: x.match === "none" ? "none" : x.match, cost_src: x.case_cost == null ? "" : "invoice" });
      if (x.upc == null) { l.upc = ""; }
      if (p && !x.bc && l.bc) l.bc_src = "till";
      l.flags = x.flags.slice(); l.alts = x.alts || []; if (x.value != null) l.inv_value = x.value;
      if (x.match === "code") l.confirmed = true;
      return l;
    });
    var doc = { id: newId("S"), kind: "delivery", sid: r.sid, ref: (supName(r.sid).split(" (")[0] + " " + (r.inv_no || "")).trim(), date: r.date || londonISO(), staff: who, lines: lines, rev: 0,
      source: "Invoice scan", localStatus: "local", unsent: true,
      scan: { inv_no: r.inv_no || "", method: r.method, lines: r.lines.length, sum: r.sum, totals: r.totals, totals_match: !!r.totals_match, warnings: r.warnings, pages: SCAN.pages.length, read_at: londonAt(), date_read: !!r.date } };
    saveLocal(doc);
    uploadPages(doc.id, SCAN.pages.slice());
    SCAN = { pages: [], parsed: null, sid: "", busy: false, method: "" };
    openDoc(doc.id);
  }
  // ---- encrypted upload of the invoice pages (only the box can open them), kept in IndexedDB until sent
  var IDB = null;
  function idb() { if (IDB) return IDB; IDB = new Promise(function (ok, no) { var r = indexedDB.open("birkhill-si-files", 1); r.onupgradeneeded = function () { r.result.createObjectStore("q", { keyPath: "key" }); }; r.onsuccess = function () { ok(r.result); }; r.onerror = function () { no(r.error); }; }); return IDB; }
  function idbDo(mode, fn) { return idb().then(function (db) { return new Promise(function (ok, no) { var tx = db.transaction("q", mode), st = tx.objectStore("q"), out = fn(st); tx.oncomplete = function () { ok(out && out.result !== undefined ? out.result : out); }; tx.onerror = function () { no(tx.error); }; }); }); }
  function b64(buf) { var b = new Uint8Array(buf), s = "", i; for (i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000)); return btoa(s); }
  function encryptFile(buf) {
    var key, iv = crypto.getRandomValues(new Uint8Array(12));
    return crypto.subtle.generateKey({ name: "AES-GCM", length: 256 }, true, ["encrypt"]).then(function (k) { key = k; return Promise.all([crypto.subtle.encrypt({ name: "AES-GCM", iv: iv }, k, buf), crypto.subtle.exportKey("raw", k), crypto.subtle.digest("SHA-256", buf)]); })
      .then(function (r) { return rsaEnc({ k: b64(r[1]) }).then(function (wk) { return { data: r[0], iv: b64(iv), wk: wk, sha: Array.prototype.map.call(new Uint8Array(r[2]), function (x) { return ("0" + x.toString(16)).slice(-2); }).join("") }; }); });
  }
  function uploadPages(docId, pages) {
    var jobs = [];
    pages.forEach(function (p, i) {
      jobs.push((p.kind === "pdf" ? p.file.arrayBuffer() : (p.canvas ? Promise.resolve(p.canvas) : imageToCanvas(p.file, 2400)).then(function (cv) { return canvasBlob(cv, 0.8); }).then(function (b) { return b.arrayBuffer(); }))
        .then(function (buf) { if (buf.byteLength > 15e6) throw new Error("file too big to keep (over 15 MB)"); return encryptFile(buf); })
        .then(function (e) { return idbDo("readwrite", function (st) { return st.put({ key: docId + "|" + i, meta: { t: "file", id: docId, n: i, of: pages.length, kind: p.kind === "pdf" ? "pdf" : "page", mime: p.kind === "pdf" ? "application/pdf" : "image/jpeg", iv: e.iv, wk: e.wk, sha: e.sha, by: staff() }, data: e.data }); }); }));
    });
    Promise.all(jobs).then(function () { flushFiles(); }).catch(function (e) { alert("The invoice pictures could not be saved for history: " + (e && e.message || e) + ". The draft is fine."); });
  }
  var fileSending = false;
  function flushFiles() {
    if (fileSending || !window.indexedDB) return; fileSending = true;
    idbDo("readonly", function (st) { return st.getAll(); }).then(function (all) {
      var it = all && all[0]; if (!it) { fileSending = false; pill(); return; }
      var body = JSON.stringify({ name: "SI1: " + JSON.stringify(it.meta), photo: "data:image/jpeg;base64," + b64(it.data), lines: [{ date: londonISO(), qty: "0" }] });
      return fetch(ENDPOINT, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain" }, body: body })
        .then(function () { return idbDo("readwrite", function (st) { return st.delete(it.key); }); })
        .then(function () { fileSending = false; flushFiles(); });
    }).catch(function () { fileSending = false; setTimeout(flushFiles, 20000); });
  }
  function filesWaiting() { return idbDo("readonly", function (st) { return st.count(); }).catch(function () { return 0; }); }
  window.addEventListener("online", flushFiles); setInterval(flushFiles, 45000); setTimeout(flushFiles, 3000);
  function viewInvoice(id) {
    $("view").innerHTML = "<div class='card'><div class='row' style='align-items:center'><h2 style='margin:0'>Invoice pictures</h2><div style='flex:0 0 auto'><button class='btn small sec' id='ivBack'>Back</button></div></div><div id='ivBody' class='m'>Loading...</div></div>";
    $("ivBack").onclick = function () { history.back(); go("reports"); };
    fetch("inv/" + id + ".json").then(function (r) { if (!r.ok) throw new Error("not on the site yet"); return r.json(); }).then(function (j) {
      $("ivBody").innerHTML = j.pages.map(function (src, i) { return "<div class='m'>Page " + (i + 1) + "</div><img alt='Invoice page " + (i + 1) + "' src='" + src + "' style='width:100%;border:1px solid #ddd;border-radius:8px;margin-bottom:10px'>"; }).join("") || "No pages.";
    }).catch(function (e) { $("ivBody").textContent = "Pictures are kept encrypted on the box; they show here after the next update (" + e.message + ")."; });
  }

  load().then(function () {
    mgrBar(); pill(); flush();
    var qp = new URLSearchParams(location.search), t = qp.get("tab") || "home";
    if (qp.get("doc")) openDoc(qp.get("doc")); else go(VIEWS[t] ? t : "home");
  }).catch(function () {
    $("view").innerHTML = "<div class='msg err'>Data locked or not loaded. Open this app once from the full link Vijay sent (it ends in #k=...).</div>";
  });
  window.__si = { lookup: lookup, allDocs: allDocs, clientCheck: clientCheck, parseEDN: parseEDN, go: go, scan: function () { return SCAN; }, filesWaiting: filesWaiting };
})();
