<script>

  var K = { queue: "birkhill-si-queue-v1", docs: "birkhill-si-local-docs-v1", mgr: "birkhill-si-manager-v1", fetch: "birkhill-si-invfetch-v1" };

  var VATS = [["", "VAT?"], ["20", "20%"], ["5", "5%"], ["0", "0%"], ["NA", "N/A"]];
  var SI = null, PR = null, BYID = {}, BYBC = {}, cur = { tab: "home", doc: null };
  function $(id) { return document.getElementById(id); }
  function jget(k, d) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }

  function money(n) { return n == null || n === "" || isNaN(Number(n)) ? "-" : "\u00a3" + Number(n).toFixed(2); }
  function num(v) { var n = parseFloat(v); return isNaN(n) ? 0 : n; }

  function costChanged(oldC, neu) {
    if (!(oldC > 0) || neu == null || isNaN(neu)) return false;
    var oldP = Math.round(oldC * 100), newP = Math.round(neu * 100);
    if (oldP === newP) return false;
    var diff = Math.abs(newP - oldP) / 100;
    if (diff >= 0.02) return true;
    return (diff / oldC) * 100 >= 3;
  }
  function pmpFromName(s) {

    var m = s.match(/\u00a3\s?(\d{1,2}(?:\.\d{1,2})?)/) || s.match(/\bPM\s?\u00a3?\s?(\d{1,2}\.\d{2})\b/i);
    if (m) { var v = parseFloat(m[1]); if (v >= 0.05 && v <= 60) return Math.round(v * 100) / 100; }

  function suggestedSell(cost, vat, sell, name) {

    var need = cost * (1 + v / 100) / (1 - 0.30);
    var p = Math.ceil((need * 100) / 10) * 10 - 1;
    var prop = Math.max(p, 9) / 100;

  function lineCostAlert(l, p) {

  }
  function docCostAlerts(d) {

  }
  function londonParts() { var f = new Intl.DateTimeFormat("en-GB", { timeZone: "Europe/London", year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false }).formatToParts(new Date()); var o = {}; f.forEach(function (p) { o[p.type] = p.value; }); return o; }
  function londonISO() { var o = londonParts(); return o.year + "-" + o.month + "-" + o.day; }
  function londonAt() { var o = londonParts(); return o.year + "-" + o.month + "-" + o.day + "T" + (o.hour === "24" ? "00" : o.hour) + ":" + o.minute + ":" + o.second; }
  function ukDate(iso) { return iso ? iso.slice(8, 10) + "/" + iso.slice(5, 7) + "/" + iso.slice(2, 4) : ""; }
  function newId(p) { var o = londonParts(), a = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789", s = ""; for (var i = 0; i < 4; i++) s += a[Math.floor(Math.random() * a.length)]; return p + o.year.slice(2) + o.month + o.day + "-" + s; }
  function each(sel, fn) { Array.prototype.forEach.call($("view").querySelectorAll(sel), fn); }
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function () {});

  // offline-safe send queue (same Apps Script and Camera Entries tab as the other Birkhill apps)
  var sending = false;
  function pill() { var q = jget(K.queue, []); $("pill").textContent = q.length + " waiting to send"; $("pill").classList.toggle("hidden", q.length === 0); }
  function queueEv(ev) { var q = jget(K.queue, []); q.push({ name: "SI1: " + JSON.stringify(ev), photo: "", lines: [{ date: londonISO(), qty: "0" }] }); jset(K.queue, q); pill(); flush(); }
  function flush() {
    if (sending) return; var q = jget(K.queue, []); pill(); if (!q.length) return; sending = true;
    fetch(ENDPOINT, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain" }, body: JSON.stringify(q[0]) })
      .then(function () { var q2 = jget(K.queue, []); q2.shift(); jset(K.queue, q2); sending = false; flush(); })
      .catch(function () { sending = false; pill(); setTimeout(flush, 15000); });
  }
  window.addEventListener("online", flush); setInterval(flush, 30000);
  function sendDraft(doc) {
    var s = JSON.stringify({ kind: doc.kind, sid: doc.sid, ref: doc.ref, date: doc.date, staff: doc.staff, notes: doc.notes || "", lines: doc.lines, returns: doc.returns || [], source: doc.source || "app", scan: doc.scan || undefined, delivered_checked: doc.delivered_checked || undefined, ud_entry: doc.ud_entry || undefined });
    var size = 30000, parts = Math.max(1, Math.ceil(s.length / size));

  function fetchJobs() {

  var _siSyncAskedAt = 0;
  function queueRow(name) {
    var q = jget(K.queue, []);
    q.push({ name: name, photo: "", lines: [{ date: londonISO(), qty: "0" }] });
    jset(K.queue, q); pill(); flush();
  }
  function formatSyncTime(iso, fallback) {
    if (fallback) return String(fallback);
    if (!iso) return "";
    try {
      var d = new Date(iso);
      if (isNaN(d.getTime())) return String(iso);
      var fmt = new Intl.DateTimeFormat("en-GB", {
        timeZone: "Europe/London", hour: "numeric", minute: "2-digit",
        hour12: true, weekday: "short", day: "numeric", month: "short", year: "numeric"
      });
      var parts = fmt.formatToParts(d);
      var get = function (ty) {
        for (var i = 0; i < parts.length; i++) if (parts[i].type === ty) return parts[i].value;
        return "";
      };
      var hour = String(parseInt(get("hour"), 10));
      var min = get("minute");
      var dayPeriod = (get("dayPeriod") || "").toLowerCase();
      return hour + ":" + min + dayPeriod + ", " + get("weekday") + " " + get("day") + " " + get("month") + " " + get("year") + " UK time";
    } catch (e) {
      return String(iso);
    }
  }
  function setStockinSyncMeta(text, cls) {
    var el = $("stockinSyncMeta");
    if (!el) return;
    el.textContent = text;
    el.className = "si-sync-meta" + (cls ? " " + cls : "");
  }
  function renderStockinSyncSuppliers(info) {
    var ul = $("stockinSyncSuppliers");
    if (!ul) return;
    var list = (info && info.suppliers) || [];
    if (!list.length) { ul.innerHTML = ""; ul.hidden = true; return; }
    ul.hidden = false;
    ul.innerHTML = list.map(function (s) {
      var cls = s.result === "new invoices found" ? "is-new" : (s.result === "sign-in needed" ? "is-login" : "is-none");
      return "<li class='" + cls + "'>" + esc(s.name) + ": " + esc(s.result) + "</li>";
    }).join("");
  }
  function syncLabel(info) {
    info = info || stockinSyncInfo || {};
    var when = info.last_synced_display || formatSyncTime(info.last_synced_at, "");
    if (!when) return "Last synced: not yet";
    return "Last synced " + when;
  }
  function applyStockinSync(info) {
    stockinSyncInfo = info || stockinSyncInfo;
    var btn = $("stockinSyncBtn");
    var waiting = _siSyncUntil && Date.now() < _siSyncUntil;
    if (btn && !waiting) btn.disabled = false;
    if (!stockinSyncInfo) {
      setStockinSyncMeta("Last synced: not yet", "");
      renderStockinSyncSuppliers(null);
      return;
    }
    if (stockinSyncInfo.status === "running" && waiting) {
      setStockinSyncMeta("Checking the till and supplier invoices...", "is-wait");
      return;
    }
    var label = syncLabel(stockinSyncInfo);
    renderStockinSyncSuppliers(stockinSyncInfo);
    if (stockinSyncInfo.status === "error") {
      setStockinSyncMeta(label + ". " + (stockinSyncInfo.note || "Sync did not finish."), "is-error");
      return;
    }
    setStockinSyncMeta(label, stockinSyncInfo.ok ? "is-ok" : "is-wait");
  }
  function loadStockinSync() {
    return fetch("stockin_sync.json?t=" + Date.now()).then(function (res) {
      if (!res.ok) throw new Error("sync");
      return res.json();
    }).then(function (data) {
      applyStockinSync(data || null);
      return data;
    }).catch(function () {
      if (!stockinSyncInfo) setStockinSyncMeta("Last synced: not yet", "");
      return null;
    });
  }
  function stopStockinSyncPoll() {
    _siSyncUntil = 0;
    if (_siSyncTimer) { clearInterval(_siSyncTimer); _siSyncTimer = null; }
    var btn = $("stockinSyncBtn");
    if (btn) btn.disabled = false;
  }
  function stockinSyncIsFresh(info) {
    if (!info || !_siSyncAskedAt) return false;
    if (info.status === "running") return false;
    var at = Date.parse(info.last_synced_at || "") || 0;
    if (at && at >= _siSyncAskedAt - 2000) return true;
    return false;
  }
  function startStockinSyncPoll() {
    if (_siSyncTimer) clearInterval(_siSyncTimer);
    _siSyncUntil = Date.now() + 35 * 60 * 1000;
    _siSyncTimer = setInterval(function () {
      if (Date.now() > _siSyncUntil) {
        stopStockinSyncPoll();
        setStockinSyncMeta((stockinSyncInfo ? syncLabel(stockinSyncInfo) + ". " : "") +
          "Still waiting for the box. Leave this page open, or try Sync again in a few minutes.", "is-wait");
        return;
      }
      Promise.all([
        loadStockinSync(),
        typeof load === "function" ? load().catch(function () { return false; }) : Promise.resolve()
      ]).then(function () {
        if (stockinSyncIsFresh(stockinSyncInfo)) {
          stopStockinSyncPoll();
          applyStockinSync(stockinSyncInfo);
          var refreshTabs = { home:1, drafts:1, approval:1, errors:1, posted:1, suppliers:1, reports:1 };
          if (cur && refreshTabs[cur.tab]) go(cur.tab);
        }
      });
    }, 10000);
  }
  function requestStockinSync() {
    var btn = $("stockinSyncBtn");
    var who = String(staff() || "").trim() || "staff";
    if (btn) btn.disabled = true;
    _siSyncAskedAt = Date.now();
    setStockinSyncMeta("Asking the box to check the till and supplier invoices...", "is-wait");
    try {
      queueRow("STOCKINSYNC: till and supplier | " + who);
      startStockinSyncPoll();
      setStockinSyncMeta("Asked the box to check the till and supplier invoices. This page will update when the sync is published.", "is-wait");
    } catch (e) {
      if (btn) btn.disabled = false;
      setStockinSyncMeta("Could not send the Sync request. Check your connection and try again.", "is-error");
    }
  }
  (function hookStockinSync() {
    var btn = $("stockinSyncBtn");
    if (btn) btn.addEventListener("click", function () { requestStockinSync(); });
  })();

  // 28 Nov 2026: photos shared from WhatsApp (Android Share > Deliveries) arrive through sw.js and run the normal scanner upload.
  function sharedSid(text) {
    var t = String(text || "").toLowerCase(), hit = "";
    SUPFLOWS.forEach(function (f) { if (!hit && f.sid && t.indexOf(f.name.toLowerCase().split(" ")[0]) >= 0) hit = f.sid; });
    return hit;
  }
  function takeShared(flag) {
    try { history.replaceState(null, "", location.pathname + location.hash); } catch (e) {}
    if (flag === "0" || !window.caches) { go("scan"); return; }
    caches.open("birkhill-share-v1").then(function (cache) {
      return cache.match("./__shared/meta").then(function (r) { return r ? r.json() : null; }).then(function (meta) {
        if (!meta || !(meta.files || []).length) { go("scan"); return; }
        return Promise.all(meta.files.map(function (m) { return cache.match(m.key).then(function (r) { return r ? r.blob() : null; }).then(function (b) { return b ? new File([b], m.name, { type: m.type || b.type }) : null; }); }))
          .then(function (files) {
            files = files.filter(Boolean);
            return Promise.all((meta.files || []).map(function (m) { return cache.delete(m.key); }).concat([cache.delete("./__shared/meta")])).then(function () {
              SHARED_NOTE = "Shared from WhatsApp: " + files.length + " file(s)" + (meta.text ? " (" + meta.text.slice(0, 80) + ")" : "") + ". Check the supplier, then create the draft as usual.";
              startUpload(sharedSid(meta.text), files, null);
              if (!SCAN.pages.length) go("scan");
            });
          });
      });
    }).catch(function () { go("scan"); });
  }
  function start() {
    load().then(function () {
      mgrBar(); pill(); flush(); loadStockinSync();
      var qp = new URLSearchParams(location.search), t = qp.get("tab") || "home";
      if (qp.get("shared") != null) takeShared(qp.get("shared"));
      else if (qp.get("doc")) openDoc(qp.get("doc")); else go(VIEWS[t] ? t : "home");
    }).catch(function (e) {
      if (e && e.locked) { $("view").innerHTML = "<div class='msg err'>Data locked or not loaded. Open this app once from the full link Vijay sent (it ends in #k=...).</div>"; return; }
      $("view").innerHTML = "<div class='msg warn'>No signal, or the update is not ready yet. Trying again. Anything you already typed is kept on this phone.</div>";
      setTimeout(start, 8000);
    });
  }
  start();
  window.__si = { lookup: lookup, allDocs: allDocs, clientCheck: clientCheck, parseEDN: parseEDN, go: go, scan: function () { return SCAN; }, filesWaiting: filesWaiting };
})();
</script>
