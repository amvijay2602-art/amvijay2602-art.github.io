<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#17643F">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Birkhill Camera">
  <title>Birkhill Date Check</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <style>
    :root {
      --green: #17643F;
      --green-dark: #0f4a2e;
      --bg: #f4f7f4;
      --text: #18342A;
      --muted: #5f6b5f;
      --card: #ffffff;
      --danger: #c62828;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100%;
    }
    body {
      padding: 20px 16px 32px;
      padding-top: max(20px, env(safe-area-inset-top));
      padding-bottom: max(32px, env(safe-area-inset-bottom));
      max-width: 480px;
      margin: 0 auto;
    }
    h1 {
      font-size: 1.4rem;
      margin: 0 0 20px;
      text-align: center;
    }
    .card {
      background: var(--card);
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }
    .take-photo {
      display: block;
      width: 100%;
      background: var(--green);
      color: #fff;
      font-size: 1.35rem;
      font-weight: 700;
      text-align: center;
      padding: 22px 16px;
      border-radius: 14px;
      cursor: pointer;
      user-select: none;
    }
    .take-photo:active { background: var(--green-dark); }
    .take-photo input {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      overflow: hidden;
    }
    #previewWrap {
      display: none;
      margin: 16px 0 0;
      text-align: center;
    }
    #preview {
      max-width: 100%;
      max-height: 280px;
      border-radius: 12px;
      object-fit: contain;
      background: #eee;
    }
    label.field {
      display: block;
      margin-top: 16px;
      font-weight: 600;
      font-size: 0.95rem;
    }
    input[type="text"], input[type="date"], input[type="number"] {
      width: 100%;
      margin-top: 6px;
      padding: 14px 12px;
      font-size: 1.05rem;
      border: 1px solid #c3d6ca;
      border-radius: 10px;
      background: #fff;
    }
    .lines-label {
      display: block;
      margin-top: 18px;
      font-weight: 600;
      font-size: 0.95rem;
    }
    .line {
      display: flex;
      gap: 10px;
      margin-top: 10px;
      align-items: stretch;
    }
    .line input[type="date"] {
      flex: 1 1 auto;
      width: auto;
      min-width: 0;
      margin-top: 0;
      padding: 16px 12px;
      font-size: 1.15rem;
    }
    .line input[type="number"] {
      flex: 0 0 7.2rem;
      width: 7.2rem;
      margin-top: 0;
      padding: 16px 8px;
      font-size: 1.15rem;
      text-align: center;
    }
    #save {
      display: block;
      width: 100%;
      margin-top: 22px;
      background: var(--green);
      color: #fff;
      font-size: 1.25rem;
      font-weight: 700;
      padding: 18px 16px;
      border: 0;
      border-radius: 14px;
      cursor: pointer;
    }
    #save:active { background: var(--green-dark); }
    #save:disabled {
      opacity: 0.6;
      cursor: default;
    }
    #status {
      margin-top: 14px;
      text-align: center;
      font-weight: 600;
      min-height: 1.4em;
    }
    #status.error { color: var(--danger); }
    #status.ok { color: var(--green-dark); }
    .hint {
      margin-top: 14px;
      color: var(--muted);
      font-size: 0.9rem;
      text-align: center;
    }
  </style>

  <style id="birkhill-theme">
    /* Birkhill Stores shared look (restyle only) */
    :root { --bk-g:#17643F; --bk-gd:#0f4a2e; --bk-o:#E86B2A; --bk-bg:#F4F7F4; --bk-ink:#18342A; --bk-line:#d5e3da; }
    html, body { background: var(--bk-bg); color: var(--bk-ink); }
    body { font-family: "Nunito Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    input, select, textarea { font-size: 16px !important; }
    button, .btn, a.btn, input[type="text"], input[type="number"], input[type="date"], input[type="search"], select { min-height: 48px; }
    .card { border-radius: 18px !important; box-shadow: 0 1px 4px rgba(24,52,42,.10) !important; }
    .bk-logo { display:block; margin: 0 auto 6px; height: 44px; width: auto; }
    body.bk-has-nav { padding-bottom: calc(88px + env(safe-area-inset-bottom)) !important; }
    .bk-nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 9990; display: grid; grid-template-columns: repeat(5, 1fr);
              background: #fff; border-top: 1px solid var(--bk-line); box-shadow: 0 -2px 8px rgba(24,52,42,.08); padding-bottom: env(safe-area-inset-bottom); }
    .bk-nav a { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:58px; color: var(--bk-ink); text-decoration:none;
                font: 700 12px/1.1 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; gap: 3px; }
    .bk-nav a .i { font-size: 20px; line-height: 1; }
    .bk-nav a.on { color: var(--bk-g); box-shadow: inset 0 3px 0 var(--bk-g); }
  </style>
  <link rel="stylesheet" href="../scanned-list.css">
</head>
<body>
  <h1>Birkhill Date Check</h1>
  <div class="card">
    <label class="take-photo">
      📷 Take Photo
      <input id="photoInput" type="file" accept="image/*" capture="environment">
    </label>
    <div id="previewWrap">
      <img id="preview" alt="Photo preview">
    </div>
    <label class="field">
      Product name
      <input id="name" type="text" autocomplete="off" autocapitalize="words" placeholder="e.g. Walkers Cheese and Onion">
    </label>
    <div class="lines-label">Best before dates</div>
    <div class="line">
      <input class="line-date" type="date" aria-label="Best before date 1">
      <input class="line-qty" type="number" inputmode="numeric" min="0" step="1" placeholder="Qty" aria-label="Quantity 1">
    </div>
    <div class="line">
      <input class="line-date" type="date" aria-label="Best before date 2">
      <input class="line-qty" type="number" inputmode="numeric" min="0" step="1" placeholder="Qty" aria-label="Quantity 2">
    </div>
    <div class="line">
      <input class="line-date" type="date" aria-label="Best before date 3">
      <input class="line-qty" type="number" inputmode="numeric" min="0" step="1" placeholder="Qty" aria-label="Quantity 3">
    </div>
    <div class="dc-qty-wrap"><span class="dc-qty-label">On shelf now (count all)</span><div class="dc-qty">
      <button type="button" class="dc-minus" aria-label="One less">&minus;</button>
      <input id="shelfQty" class="dc-shelf" type="number" inputmode="numeric" min="0" step="1" placeholder="How many?" aria-label="Quantity on shelf">
      <button type="button" class="dc-plus" aria-label="One more">+</button>
    </div></div>
    <button id="save" type="button">Save</button>
    <div class="dc-row2">
      <button id="dcSkip" class="dc-btn" type="button">Skip</button>
      <button id="dcFinish" class="dc-btn finish" type="button">Finish</button>
    </div>
    <p id="dcProgress" class="hint">Skip moves on to the next item. Finish ends this check at any time.</p>
    <div id="status"></div>
    <div id="scannedBox" class="bk-scanned">
      <h2>Scanned items</h2>
      <p id="scannedTotals" class="bk-scan-totals hidden"></p>
      <ul id="scannedList" class="bk-scan-list"></ul>
      <p id="scannedEmpty" class="hint">No items yet. Save a product and it will appear here.</p>
    </div>
  </div>
  <p class="hint">Add this page to your home screen for one-tap access.</p>
  <script src="../secure-data.js"></script>
  <script src="../scanned-list.js"></script>
  <script src="../datecount.js"></script>
  <script>
    const ENDPOINT = "https://script.google.com/macros/s/AKfycbz7eKFQN2UbbSA8-4nLzB9crDkQUE5b7_CJ3wnVfqmxODFIfz8G3XNpQ1_igg9SCNJbKg/exec";
    const photoInput = document.getElementById("photoInput");
    const preview = document.getElementById("preview");
    const previewWrap = document.getElementById("previewWrap");
    const nameInput = document.getElementById("name");
    const saveBtn = document.getElementById("save");
    const statusEl = document.getElementById("status");
    const SCANNED_KEY = "birkhill-date-check-scanned-v1";
    let photoDataUrl = "";
    let scannedItems = [];

    function todayLondon() {
      return new Intl.DateTimeFormat("en-CA", {
        timeZone: "Europe/London",
        year: "numeric",
        month: "2-digit",
        day: "2-digit"
      }).format(new Date());
    }

    function lineQty(item) {
      if (Array.isArray(item.lines)) {
        return item.lines.reduce(function (a, l) { return a + (Number(l.qty) || 0); }, 0);
      }
      return Number(item.qty) || 0;
    }

    function setLineQty(item, q) {
      q = Math.max(0, Number(q) || 0);
      if (Array.isArray(item.lines) && item.lines.length) {
        const rest = item.lines.slice(1).reduce(function (a, l) { return a + (Number(l.qty) || 0); }, 0);
        item.lines[0].qty = String(Math.max(0, q - rest));
      } else {
        item.qty = q;
      }
    }

    function persistScanned() {
      try {
        localStorage.setItem(SCANNED_KEY, JSON.stringify({ date: todayLondon(), items: scannedItems }));
      } catch (e) {}
    }

    function restoreScanned() {
      try {
        const raw = localStorage.getItem(SCANNED_KEY);
        if (!raw) return;
        const data = JSON.parse(raw);
        if (data && data.date === todayLondon() && Array.isArray(data.items)) scannedItems = data.items;
      } catch (e) {}
    }

    function renderScanned() {
      if (!window.BirkhillScannedList) return;
      BirkhillScannedList.render({
        root: document.getElementById("scannedBox"),
        listEl: document.getElementById("scannedList"),
        totalsEl: document.getElementById("scannedTotals"),
        emptyEl: document.getElementById("scannedEmpty"),
        items: scannedItems,
        alreadyNewest: true,
        name: function (item) { return item.name || "Unknown"; },
        barcode: function (item) { return item.barcode || ""; },
        price: function (item) { return item.price; },
        qty: function (item) { return lineQty(item); },
        extra: function (item) {
          if (!Array.isArray(item.lines)) return "";
          return item.lines.map(function (line) {
            var d = line.date || "";
            if (/^\d{4}-\d{2}-\d{2}$/.test(d)) d = d.slice(8, 10) + "/" + d.slice(5, 7) + "/" + d.slice(0, 4);
            return d + (line.qty ? "  x  " + line.qty : "");
          }).join("  ·  ");
        },
        onMinus: function (item, index) {
          const q = lineQty(item);
          if (q <= 0) return;
          setLineQty(item, q - 1);
          persistScanned();
          renderScanned();
        },
        onPlus: function (item, index) {
          setLineQty(item, lineQty(item) + 1);
          persistScanned();
          renderScanned();
        },
        onRemove: function (item, index) {
          scannedItems.splice(index, 1);
          persistScanned();
          renderScanned();
        }
      });
    }

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    }

    function setStatus(msg, kind) {
      statusEl.textContent = msg;
      statusEl.className = kind || "";
    }

    function collectLines() {
      const dates = document.querySelectorAll(".line-date");
      const qtys = document.querySelectorAll(".line-qty");
      const lines = [];
      for (let i = 0; i < dates.length; i++) {
        const date = dates[i].value.trim();
        if (!date) continue;
        lines.push({ date: date, qty: qtys[i].value.trim() });
      }
      return lines;
    }

    function downscale(file) {
      return new Promise(function (resolve, reject) {
        const reader = new FileReader();
        reader.onerror = function () { reject(new Error("Could not read the photo")); };
        reader.onload = function () {
          const img = new Image();
          img.onerror = function () { reject(new Error("Could not load the photo")); };
          img.onload = function () {
            let w = img.width;
            let h = img.height;
            const max = 1280;
            if (w > max || h > max) {
              if (w > h) {
                h = Math.round(h * max / w);
                w = max;
              } else {
                w = Math.round(w * max / h);
                h = max;
              }
            }
            const canvas = document.createElement("canvas");
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL("image/jpeg", 0.8));
          };
          img.src = reader.result;
        };
        reader.readAsDataURL(file);
      });
    }

    photoInput.addEventListener("change", function () {
      const file = photoInput.files && photoInput.files[0];
      if (!file) return;
      setStatus("Preparing photo...", "");
      downscale(file).then(function (dataUrl) {
        photoDataUrl = dataUrl;
        preview.src = dataUrl;
        previewWrap.style.display = "block";
        setStatus("", "");
      }).catch(function () {
        photoDataUrl = "";
        setStatus("Could not use that photo. Please try again.", "error");
      });
    });

    function clearForm() {
      photoDataUrl = "";
      photoInput.value = "";
      preview.src = "";
      previewWrap.style.display = "none";
      nameInput.value = "";
      document.querySelectorAll(".line-date, .line-qty, #shelfQty").forEach(function (el) {
        el.value = "";
      });
    }

    saveBtn.addEventListener("click", function () {
      const name = nameInput.value.trim();
      const lines = collectLines();
      if (!name || lines.length === 0) {
        setStatus("Please enter the product name and at least one date.", "error");
        return;
      }
      const shelfRaw = shelfInput.value.trim();
      if (shelfRaw === "" || isNaN(Number(shelfRaw)) || Number(shelfRaw) < 0) {
        setStatus("Please enter how many are on the shelf (0 if none), or tap Skip.", "error");
        shelfInput.focus();
        return;
      }
      saveBtn.disabled = true;
      setStatus("Saving...", "");
      fetch(ENDPOINT, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify({ name: name, photo: photoDataUrl || "", lines: lines })
      }).then(function () {
        scannedItems.unshift({
          name: name,
          barcode: "",
          lines: lines,
          at: Date.now()
        });
        persistScanned();
        renderScanned();
        if (dc) {
          const first = lines.slice().sort(function (a, b) { return a.date < b.date ? -1 : 1; })[0];
          dc.count(dcItem(name), Number(shelfRaw), first.date, "OK", first.qty === "" ? null : Number(first.qty));
          dcUpdate();
        }
        setStatus("Saved ✓", "ok");
        clearForm();
      }).catch(function () {
        setStatus("Could not save. Check your connection and try again.", "error");
      }).then(function () {
        saveBtn.disabled = false;
      });
    });

    /* Shelf stock count with the date check (20 Nov 2026): COUNT rows like the Stock Count app. Never writes to the till. */
    const shelfInput = document.getElementById("shelfQty");
    const dc = window.BirkhillDateCount ? BirkhillDateCount.create({ app: "date", key: "DATECHECK", dept: "Date check", total: function () { return 0; } }) : null;
    function dcItem(name) {
      const slug = name.toUpperCase().replace(/[^A-Z0-9]+/g, " ").trim();
      return { key: "N:" + slug, id: "N:" + slug, barcode: "", name: name, size: "", till: 0, scan: "manual:name only" };
    }
    function dcUpdate() {
      const el = document.getElementById("dcProgress");
      if (!dc || !el) return;
      const sm = dc.summary();
      el.textContent = sm.session ? ("This check: " + sm.checked + " checked, " + sm.skipped + " skipped. Tap Finish when you stop.") : "Skip moves on to the next item. Finish ends this check at any time.";
    }
    document.getElementById("dcSkip").addEventListener("click", function () {
      const name = nameInput.value.trim();
      if (!name) { setStatus("Type the product name first, then tap Skip.", "error"); nameInput.focus(); return; }
      if (!dc) return;
      dc.skip(dcItem(name));
      clearForm();
      dcUpdate();
      setStatus("Skipped " + name + ". Next item.", "ok");
    });
    document.getElementById("dcFinish").addEventListener("click", function () {
      if (!dc) return;
      dc.finish();
      dcUpdate();
      setStatus("Date check finished.", "ok");
    });
    dcUpdate();

    restoreScanned();
    renderScanned();
  </script>
  <script src="../nav.js"></script>
</body>
</html>
